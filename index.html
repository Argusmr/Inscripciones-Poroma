<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CEA Micaela Bastidas - Preinscripción</title>
    <meta name="theme-color" content="#198C4A" />
    <meta name="description" content="Preinscripción rápida y sencilla para el CEA Micaela Bastidas en Poroma" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-cea.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body class="bg-[#FFF8E7] text-[#123D2C] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol !== 'http:' || window.location.hostname === 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration skipped or failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
