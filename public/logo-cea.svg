<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 950" width="800" height="950">
  <defs>
    <path id="textArcTop" d="M 75,520 A 325,410 0 0,1 725,520" fill="none"/>
    <path id="textArcBottom" d="M 725,430 A 325,410 0 0,1 75,430" fill="none"/>
    
    <pattern id="stipple" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#ECEFF1"/>
      <circle cx="2" cy="2" r="1" fill="#B0BEC5" opacity="0.6"/>
      <circle cx="7" cy="7" r="1" fill="#B0BEC5" opacity="0.6"/>
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Green Oval ring -->
  <ellipse cx="400" cy="475" rx="380" ry="450" fill="#198C4A" stroke="#0E5E30" stroke-width="8"/>

  <!-- Inner Silver/Stippled Oval -->
  <ellipse cx="400" cy="475" rx="270" ry="340" fill="url(#stipple)" stroke="#374151" stroke-width="4"/>

  <!-- Center Rounded Panel for Micaela Bastidas Graphic -->
  <rect x="250" y="190" width="300" height="310" rx="36" ry="36" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2" filter="url(#shadow)"/>

  <!-- MICAELA BASTIDAS GRAPHIC -->
  <g transform="translate(250, 190)">
    <!-- Hair braid -->
    <path d="M 180 110 Q 210 160 175 220 C 165 240 180 260 170 270" fill="none" stroke="#111827" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Red dress torso -->
    <path d="M 60 260 Q 150 140 240 260 L 255 300 L 45 300 Z" fill="#D32F2F"/>
    
    <!-- Blue shawl / collar -->
    <path d="M 100 180 Q 150 210 200 180 L 215 235 Q 150 255 85 235 Z" fill="#1E3A8A"/>

    <!-- Neck and face -->
    <path d="M 135 160 Q 150 175 165 160 L 165 135 L 135 135 Z" fill="#F3A683"/>
    <ellipse cx="150" cy="110" rx="40" ry="48" fill="#F3A683"/>
    
    <!-- Hair line -->
    <path d="M 110 105 C 110 65 190 65 190 105 C 190 85 170 75 150 75 C 130 75 110 85 110 105 Z" fill="#111827"/>
    <path d="M 110 110 C 110 120 120 135 130 140 C 120 125 115 115 110 110 Z" fill="#111827"/>

    <!-- Facial details -->
    <ellipse cx="136" cy="108" rx="4" ry="3" fill="#1F2937"/>
    <ellipse cx="164" cy="108" rx="4" ry="3" fill="#1F2937"/>
    <path d="M 130 100 Q 136 96 142 100" fill="none" stroke="#111827" stroke-width="2.5"/>
    <path d="M 158 100 Q 164 96 170 100" fill="none" stroke="#111827" stroke-width="2.5"/>
    <path d="M 150 108 L 147 120 L 153 120 Z" fill="#E08B6B"/>
    <path d="M 140 128 Q 150 134 160 128" fill="none" stroke="#B91C1C" stroke-width="3" stroke-linecap="round"/>

    <!-- Crossed Arms -->
    <path d="M 60 250 Q 110 270 160 260" fill="none" stroke="#F3A683" stroke-width="24" stroke-linecap="round"/>
    <path d="M 240 250 Q 190 270 140 260" fill="none" stroke="#F3A683" stroke-width="24" stroke-linecap="round"/>

    <!-- Green Feather Quill -->
    <path d="M 185 115 Q 230 160 255 240" fill="none" stroke="#10B981" stroke-width="24" stroke-linecap="round"/>
    <path d="M 185 115 Q 240 150 260 220 L 235 235 Z" fill="#059669"/>
    <path d="M 195 135 L 225 145 M 205 160 L 238 172 M 215 185 L 248 200" stroke="#047857" stroke-width="3.5"/>

    <!-- Golden Book with Text -->
    <g transform="translate(50, 215)">
      <polygon points="100,45 10,70 100,95 190,70" fill="#D97706" stroke="#92400E" stroke-width="3"/>
      <polygon points="100,45 100,95 10,70" fill="#F59E0B"/>
      <polygon points="100,45 100,95 190,70" fill="#D97706"/>
      <!-- Pages -->
      <path d="M 15 71 Q 100 48 185 71 L 185 77 Q 100 53 15 77 Z" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
      <!-- Inscription -->
      <text x="100" y="28" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="16" fill="#000000" text-anchor="middle">ESTUDIO</text>
      <text x="100" y="44" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="14" fill="#000000" text-anchor="middle">- TRABAJO -</text>
      <text x="100" y="60" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="14" fill="#000000" text-anchor="middle">HONESTIDAD</text>
    </g>
  </g>

  <!-- LOWER TEXT INSIDE OVAL -->
  <text x="400" y="610" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="72" fill="#000000" text-anchor="middle" letter-spacing="4">C.E.A.</text>
  <text x="400" y="690" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="46" fill="#000000" text-anchor="middle" letter-spacing="1">“MICAELA BASTIDAS”</text>

  <!-- TOP GREEN RING ARC TEXT -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="34" fill="#FFFFFF" letter-spacing="2.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      CENTRO DE EDUCACION ALTERNATIVA
    </textPath>
  </text>

  <!-- BOTTOM GREEN RING ARC TEXT -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      POROMA - CHUQUISACA - BOLIVIA
    </textPath>
  </text>
</svg>